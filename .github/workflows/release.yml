name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-platform:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: win32-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build platform package
        run: bun run release:build -- --platform=${{ matrix.platform }}
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: release-out/
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build-platform
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: platform-*
          merge-multiple: true

      - name: Resolve version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stage wrapper package
        run: bun run release:prepare

      - name: Verify publish tarballs
        shell: bash
        run: |
          set -euo pipefail
          for pkg in release-out/@babalcode/cli release-out/@babalcode/cli-*; do
            [ -d "$pkg" ] || continue
            echo "==> npm pack --dry-run $pkg"
            (cd "$pkg" && npm pack --dry-run 2>&1) | tee /tmp/pack.log
            if grep -E '\.(ts|tsx|map)$' /tmp/pack.log; then
              echo "ERROR: source or sourcemap files would be published"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in release-out/@babalcode/cli-*; do
            [ -d "$pkg" ] || continue
            echo "Publishing $(basename "$pkg")"
            (cd "$pkg" && npm publish --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish wrapper package
        shell: bash
        run: cd release-out/@babalcode/cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
