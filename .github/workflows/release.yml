name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-platform:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: win32-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build platform package
        run: bun run release:build -- --platform=${{ matrix.platform }}
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.platform }}
          path: release-out/@babalcode/
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build-platform
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: artifact-staging
          pattern: platform-*
          merge-multiple: true

      - name: Collect platform packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out/@babalcode

          # Each artifact uploads one platform folder; layout varies after merge.
          while IFS= read -r -d '' pkg_json; do
            pkg_dir=$(dirname "$pkg_json")
            name=$(basename "$pkg_dir")
            case "$name" in
              cli-darwin-arm64|cli-darwin-x64|cli-linux-arm64|cli-linux-x64|cli-win32-x64)
                echo "Collecting $name from $pkg_dir"
                rm -rf "release-out/@babalcode/$name"
                cp -a "$pkg_dir" "release-out/@babalcode/$name"
                ;;
            esac
          done < <(find artifact-staging -type f -path '*/cli-*/package.json' -print0 2>/dev/null || find artifact-staging -type f -name package.json -print0)

          count=$(find release-out/@babalcode -maxdepth 1 -type d -name 'cli-*' | wc -l)
          echo "Platform packages ready: $count"
          ls -la release-out/@babalcode/
          if [ "$count" -lt 5 ]; then
            echo "ERROR: expected 5 platform packages before publish, found $count"
            find artifact-staging -type f -name package.json || true
            exit 1
          fi

      - name: Resolve version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stage wrapper package
        run: bun run release:prepare

      - name: Verify publish tarballs
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for pkg in release-out/@babalcode/cli release-out/@babalcode/cli-*; do
            [ -d "$pkg" ] || continue
            count=$((count + 1))
            echo "==> npm pack --dry-run $pkg"
            (cd "$pkg" && npm pack --dry-run 2>&1) | tee /tmp/pack.log
            if grep -E '\.(ts|tsx|map)$' /tmp/pack.log; then
              echo "ERROR: source or sourcemap files would be published"
              exit 1
            fi
          done
          if [ "$count" -lt 6 ]; then
            echo "ERROR: expected 6 packages to verify (1 wrapper + 5 platform), found $count"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          published=0
          for pkg in release-out/@babalcode/cli-*; do
            [ -d "$pkg" ] || continue
            name=$(basename "$pkg")
            echo "Publishing $name"
            (cd "$pkg" && npm publish --access public)
            published=$((published + 1))
          done
          if [ "$published" -lt 5 ]; then
            echo "ERROR: expected to publish 5 platform packages, published $published"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish wrapper package
        shell: bash
        run: |
          set -euo pipefail
          cd release-out/@babalcode/cli
          if npm publish --access public; then
            exit 0
          fi
          code=$?
          if npm view "@babalcode/cli@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "Wrapper @babalcode/cli@${RELEASE_VERSION} is already published — skipping."
            exit 0
          fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
